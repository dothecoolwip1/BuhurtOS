name: Pack 24 production check (one-shot)
# Read-only browser check of the LIVE site after the Pack 24 deploy: scripts/e2e/pack24-production-check.mjs (390x844, 768x1024, 1024x768, fresh contexts).
# Runs only when this file changes on the Pack 24 branch; it never writes sporting data, never creates fights, device codes or staff rows, never signs
# anyone up. The fixed smoke account (SMOKE_X_*, a club test member with no event role) is used only to sign in and out. Removed again after the run.
on:
  push:
    branches: [claude/pack-24-safety-reconcile-grf0gg]
    paths: [.github/workflows/pack24-production-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright-core install --with-deps chromium
      - name: Check the live site
        env:
          BASE: https://dothecoolwip1.github.io/BuhurtOS
          EXPECT_BUILD: '153'
          EXPECT_COMMIT: 4298aec
          SHOTS: /tmp/p24-prod-shots
          SMOKE_X_EMAIL: ${{ secrets.SMOKE_X_EMAIL }}
          SMOKE_X_PASSWORD: ${{ secrets.SMOKE_X_PASSWORD }}
        run: node scripts/e2e/pack24-production-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pack24-production-shots
          path: /tmp/p24-prod-shots
