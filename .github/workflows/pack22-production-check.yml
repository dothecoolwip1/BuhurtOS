name: Pack 22 production check (one-shot)
# Read-only browser check of the LIVE site after the Pack 22 deploy: scripts/e2e/pack22-production-check.mjs (desktop + phone-sized, fresh contexts).
# Runs only when this file changes on the Pack 22 branch; it never publishes and never writes data. No secrets are passed. (run 3, after PR #50)
on:
  push:
    branches: [ccr-321cc545-1coq4p]
    paths: [.github/workflows/pack22-production-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright-core install --with-deps chromium
      - name: Check the live site
        env:
          BASE: https://dothecoolwip1.github.io/BuhurtOS
          EXPECT_BUILD: '146'
          EXPECT_COMMIT: 643a62a
          SHOTS: /tmp/p22-prod-shots
        run: node scripts/e2e/pack22-production-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pack22-production-shots
          path: /tmp/p22-prod-shots
