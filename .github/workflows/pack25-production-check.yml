name: Pack 25 production check (read-only)
# Read-only browser + public API check of the LIVE site and the deployed device-session function after the Pack 25 rollout:
# scripts/e2e/pack25-production-check.mjs. Never writes anything (no sign-in, no fight, no code, no session). Three published test events
# (synthetic, or the owner's own test event) in their three phases, the legacy addresses, the workstations signed out, the device page, the
# function's refusals and CORS. Run it by hand after a deployment (Actions › this workflow › Run workflow) with the build number and commit
# the Pages run printed. It ran against the pre-rollout site once as the baseline (see PACK_25_EVENT_CONTROL_AND_COUNTERS.md §9.4).
on:
  workflow_dispatch:
    inputs:
      expect_build:
        description: 'Build number the live bundle must carry (empty = any)'
        default: ''
      expect_commit:
        description: 'Short commit the live bundle must carry (empty = any)'
        default: ''
      phases:
        description: 'Event phases to open (upcoming,live,completed)'
        default: 'upcoming,live,completed'
      event_live:
        description: 'Slug of a published event that is live now'
        default: 'testing-stuff-v3'
      sections:
        description: 'fn = the deployed function only (seconds); fn,ui = also the browser journeys (minutes; on a pre-Pack-25 build every wait times out, so allow 40)'
        default: 'fn,ui'
      shots_label:
        description: 'If set, the screenshots are committed to docs/reviews/assets/2026-10-07-pack25-hosted/<label>/ on this branch (the Actions artifact is kept either way)'
        default: ''
permissions:
  contents: write   # only the optional screenshot commit below writes; the check itself is read-only
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright-core install --with-deps chromium
      - name: Check the live site (read-only)
        env:
          BASE: https://dothecoolwip1.github.io/BuhurtOS
          API: https://mvbxlebznlgroptwwdsm.supabase.co
          SHOTS: ${{ github.workspace }}/p25-hosted-shots
          EXPECT_BUILD: ${{ github.event.inputs.expect_build }}
          EXPECT_COMMIT: ${{ github.event.inputs.expect_commit }}
          PHASES: ${{ github.event.inputs.phases || 'upcoming,live,completed' }}
          EVENT_LIVE: ${{ github.event.inputs.event_live || 'testing-stuff-v3' }}
          SECTIONS: ${{ github.event.inputs.sections || 'fn,ui' }}
        run: node scripts/e2e/pack25-production-check.mjs
      - name: Keep the hosted screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pack25-hosted-screenshots
          path: p25-hosted-shots
          if-no-files-found: ignore
      - name: Commit the hosted screenshots to the branch (only when a label is given)
        if: always() && github.event.inputs.shots_label != ''
        env:
          LABEL: ${{ github.event.inputs.shots_label }}
        run: |
          set -e
          case "$LABEL" in *[!A-Za-z0-9._-]*|'') echo "bad label"; exit 1;; esac
          DEST="docs/reviews/assets/2026-10-07-pack25-hosted/$LABEL"
          mkdir -p "$DEST" && cp p25-hosted-shots/*.png "$DEST"/ 2>/dev/null || { echo "no screenshots"; exit 0; }
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST" && git commit -m "Pack 25 hosted screenshots: $LABEL (run ${{ github.run_id }}, read-only production check)" && git push origin HEAD:${{ github.ref_name }}
