name: Test events removed check (one-shot)
# Read-only browser + public API check of the LIVE site after the one-off deletion of test-stuff-test and test-new-test:
# scripts/e2e/test-events-removed-check.mjs. Never writes anything. Runs only when this file changes on this branch; removed again after the run.
on:
  push:
    branches: [claude/pack-24-safety-reconcile-grf0gg]
    paths: [.github/workflows/test-events-removed-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright-core install --with-deps chromium
      - name: Check the live site
        env:
          BASE: https://dothecoolwip1.github.io/BuhurtOS
          SMOKE_X_EMAIL: ${{ secrets.SMOKE_X_EMAIL }}
          SMOKE_X_PASSWORD: ${{ secrets.SMOKE_X_PASSWORD }}
        run: node scripts/e2e/test-events-removed-check.mjs
